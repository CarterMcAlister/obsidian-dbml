name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: Build and upload release assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.GITHUB_REF_NAME?.replace(/^v/, '');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('src/manifest.json', 'utf8'));

          if (pkg.version !== manifest.version) {
            throw new Error(`package.json version (${pkg.version}) must match src/manifest.json version (${manifest.version})`);
          }

          if (tag !== manifest.version) {
            throw new Error(`release tag (${process.env.GITHUB_REF_NAME}) must match manifest version (${manifest.version})`);
          }
          NODE

      - name: Build plugin
        run: bun run build

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
